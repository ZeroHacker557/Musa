    <!--
      Ochilish animatsiyasi — «Muzlash».
      Chetlardan qirov o'sib logoni qoplaydi, logo muzdek yaltiraydi, so'ng
      ko'rinish silliq so'nib, ostidan ilova ochiladi.

      ATAYLAB shu yerda, oddiy (module bo'lmagan) skript bilan: React va
      JavaScript bundle yuklanishini kutmay, Telegram oynani ochgan zahoti
      chiziladi — oq chaqnash bo'lmaydi.

      Qoidalar:
        - ilova tayyor bo'lganda tugaydi (window 'musa:ready'), lekin kamida
          animatsiya ko'rinib ulguradi va 2,6 soniyadan ortiq kutilmaydi;
        - bosilsa darhol o'tkazib yuboriladi;
        - bir kunda qayta ochilganda — qisqa variant (faqat logo);
        - «harakatni kamaytirish» yoqilgan telefonda — oddiy so'nish.
    -->
    <style id="splash-style">
      #splash {
        position: fixed; inset: 0; z-index: 2147483000; overflow: hidden;
        background: radial-gradient(120% 90% at 50% 45%, #0d6a3c 0%, #064228 55%, #021a10 100%);
        touch-action: none; -webkit-tap-highlight-color: transparent;
      }
      #splash canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      #splash .sp-frost {
        position: absolute; inset: 0; pointer-events: none; opacity: 0; transform: scale(1.3);
        background: radial-gradient(closest-side at 50% 50%, transparent 46%, rgba(190, 232, 255, 0.14) 70%, rgba(230, 248, 255, 0.6) 100%);
        animation: spFrost 0.95s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }
      #splash .sp-logo {
        position: absolute; left: 50%; top: 50%; width: 112px; height: 112px; margin: -56px 0 0 -56px;
        border-radius: 28px; overflow: hidden; opacity: 0; transform: scale(0.84);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        transition: box-shadow 0.4s ease;
        animation: spLogoIn 0.5s cubic-bezier(0.2, 0.9, 0.25, 1.25) 0.05s forwards;
      }
      #splash .sp-logo img { display: block; width: 100%; height: 100%; }
      #splash .sp-logo::before,
      #splash .sp-logo::after { content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none; }
      #splash .sp-logo::before {
        opacity: 0; transition: opacity 0.4s ease;
        background:
          radial-gradient(circle at 12% 10%, rgba(255, 255, 255, 0.85) 0 6%, transparent 22%),
          radial-gradient(circle at 88% 92%, rgba(225, 245, 255, 0.7) 0 5%, transparent 20%),
          linear-gradient(160deg, rgba(236, 249, 255, 0.7) 0%, rgba(170, 222, 255, 0.28) 42%, rgba(210, 238, 255, 0.35) 100%);
      }
      #splash .sp-logo::after {
        transform: translateX(-130%);
        background: linear-gradient(115deg, transparent 32%, rgba(255, 255, 255, 0.9) 48%, transparent 62%);
      }
      #splash.is-frozen .sp-logo {
        box-shadow: 0 0 0 2px rgba(228, 247, 255, 0.95), 0 0 0 6px rgba(190, 232, 255, 0.22), 0 0 48px rgba(165, 225, 255, 0.8), 0 18px 50px rgba(0, 0, 0, 0.45);
      }
      #splash.is-frozen .sp-logo img { filter: saturate(0.78) brightness(1.12) contrast(0.95); transition: filter 0.5s ease; }
      #splash.is-frozen .sp-logo::before { opacity: 1; }
      #splash.is-frozen .sp-logo::after { animation: spShine 1.5s ease-in-out 0.05s infinite; }
      #splash.is-quick .sp-frost { display: none; }
      #splash.is-leaving { opacity: 0; transform: scale(1.04); transition: opacity 0.45s ease, transform 0.45s ease; }
      #splash.is-quick.is-leaving { transition-duration: 0.32s; }
      @keyframes spFrost { to { opacity: 1; transform: scale(1); } }
      @keyframes spLogoIn { to { opacity: 1; transform: scale(1); } }
      @keyframes spShine { 0% { transform: translateX(-130%); } 55%, 100% { transform: translateX(130%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash * { animation: none !important; }
        #splash .sp-logo { opacity: 1; transform: none; }
      }
    </style>

    <script>
      (function () {
        var root = document.getElementById('splash')
        if (!root) return
        var html = document.documentElement
        html.setAttribute('data-splash', 'on')

        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches
        var today = new Date().toDateString()
        var quick = reduce
        try {
          if (localStorage.getItem('musaSplashDay') === today) quick = true
          localStorage.setItem('musaSplashDay', today)
        } catch (e) { /* xotira yopiq — to'liq variant */ }
        if (quick) root.classList.add('is-quick')

        // Telegram paneli splash rangida — pastda oq chiziq qolmasin
        try {
          var tg = window.Telegram && window.Telegram.WebApp
          if (tg) {
            if (tg.setHeaderColor) tg.setHeaderColor('#064228')
            if (tg.setBackgroundColor) tg.setBackgroundColor('#021a10')
          }
        } catch (e) { /* eski Telegram */ }

        var start = performance.now()
        var MIN = quick ? 380 : 1150
        var MAX = 2600
        var ready = false
        var done = false

        function whenReady() {
          if (!ready || done) return
          var left = MIN - (performance.now() - start)
          if (left > 0) setTimeout(finish, left)
          else finish()
        }
        window.addEventListener('musa:ready', function () { ready = true; whenReady() })
        root.addEventListener('pointerdown', finish)
        setTimeout(finish, MAX)

        // ── Qirov ──
        var canvas = root.querySelector('canvas')
        var ctx = canvas.getContext('2d')
        var W = window.innerWidth
        var H = window.innerHeight
        var D = Math.min(window.devicePixelRatio || 1, 2)
        canvas.width = Math.round(W * D)
        canvas.height = Math.round(H * D)
        ctx.scale(D, D)
        var cx = W / 2
        var cy = H / 2
        var LOGO_R = 70
        var GROW_MS = 820
        var branches = []

        function addBranch(x, y, angle, width, depth, max, speed) {
          branches.push({ x: x, y: y, a: angle, w: width, d: depth, life: 0, max: max, v: speed, next: 14 + Math.random() * 22 })
        }

        // Urug'lar — ekran chetlari bo'ylab, markazga qaragan
        var seeds = Math.round(22 + Math.min(W, H) / 30)
        for (var i = 0; i < seeds; i++) {
          var t = (i + Math.random() * 0.8) / seeds * 2 * (W + H)
          var x, y
          if (t < W) { x = t; y = -4 }
          else if (t < W + H) { x = W + 4; y = t - W }
          else if (t < 2 * W + H) { x = 2 * W + H - t; y = H + 4 }
          else { x = -4; y = 2 * (W + H) - t }
          var dist = Math.hypot(cx - x, cy - y)
          // Qirov chetda qalin, markazga yetmay to'xtaydi — logo atrofi ochiq qoladi
          var max = (dist - LOGO_R) * (0.55 + Math.random() * 0.4)
          addBranch(x, y, Math.atan2(cy - y, cx - x) + (Math.random() - 0.5) * 0.6, 1.5, 0, max, max / GROW_MS * (0.85 + Math.random() * 0.3))
        }

        var groups = [[], [], [], []]
        function grow(b, dist) {
          var seg = 5
          while (dist > 0 && b.life < b.max) {
            var s = Math.min(seg, dist, b.max - b.life)
            dist -= s
            // Muz ignasi deyarli to'g'ri o'sadi
            b.a += (Math.random() - 0.5) * 0.08
            var nx = b.x + Math.cos(b.a) * s
            var ny = b.y + Math.sin(b.a) * s
            groups[b.d].push(b.x, b.y, nx, ny)
            b.x = nx; b.y = ny; b.life += s
            if (b.life > b.next && b.d < 3) {
              // Muz kristali — shoxlar 60° ostida, juft-juft (patsimon naqsh)
              b.next += 7 + Math.random() * 12
              var len = Math.min((b.max - b.life) * 0.6, 34 / (b.d + 1) + Math.random() * 22)
              if (len > 4) {
                addBranch(b.x, b.y, b.a + Math.PI / 3 + (Math.random() - 0.5) * 0.12, b.w * 0.6, b.d + 1, len, b.v * 0.8)
                if (Math.random() < 0.8) addBranch(b.x, b.y, b.a - Math.PI / 3 + (Math.random() - 0.5) * 0.12, b.w * 0.6, b.d + 1, len * (0.7 + Math.random() * 0.3), b.v * 0.8)
              }
            }
          }
          if (b.life >= b.max && b.d === 0) star(b.x, b.y, 2.5 + Math.random() * 2.5)
        }
        function star(x, y, r) {
          ctx.strokeStyle = 'rgba(236, 250, 255, 0.8)'
          ctx.lineWidth = 0.8
          ctx.beginPath()
          for (var k = 0; k < 3; k++) {
            var a = k * Math.PI / 3
            ctx.moveTo(x - Math.cos(a) * r, y - Math.sin(a) * r)
            ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r)
          }
          ctx.stroke()
        }
        function flush() {
          ctx.globalCompositeOperation = 'lighter'
          for (var d = 0; d < 4; d++) {
            var g = groups[d]
            if (!g.length) continue
            var w = 1.5 * Math.pow(0.6, d)
            ctx.lineCap = 'round'
            ctx.strokeStyle = 'rgba(170, 226, 255, 0.07)'
            ctx.lineWidth = w * 4
            ctx.beginPath()
            for (var j = 0; j < g.length; j += 4) { ctx.moveTo(g[j], g[j + 1]); ctx.lineTo(g[j + 2], g[j + 3]) }
            ctx.stroke()
            ctx.strokeStyle = d === 0 ? 'rgba(240, 251, 255, 0.72)' : 'rgba(225, 246, 255, ' + (0.62 - d * 0.1) + ')'
            ctx.lineWidth = Math.max(0.5, w)
            ctx.stroke()
            groups[d] = []
          }
          ctx.globalCompositeOperation = 'source-over'
        }

        var last = start
        var frozen = false
        function frame(now) {
          if (done) return
          var dt = Math.min(40, now - last)
          last = now
          if (!quick) {
            var count = branches.length
            for (var i = 0; i < count; i++) {
              var b = branches[i]
              if (b.life < b.max) grow(b, b.v * dt)
            }
            flush()
          }
          if (!frozen && now - start > (quick ? 120 : GROW_MS * 0.8)) {
            frozen = true
            root.classList.add('is-frozen')
          }
          requestAnimationFrame(frame)
        }
        requestAnimationFrame(frame)

        // ── Yakun: darz ketish va sochilish ──
        function finish() {
          if (done) return
          done = true
          // Kafolat: kadrlar to'xtab qolsa ham (ilova fonga o'tgan bo'lsa)
          // splash ilovani yopib qolmaydi
          setTimeout(cleanup, 1500)
          if (document.hidden) { cleanup(); return }
          // Muzlagan ko'rinishdan ilovaga silliq o'tish
          root.classList.add('is-leaving')
          setTimeout(cleanup, quick ? 340 : 480)
        }

        var cleaned = false
        function cleanup() {
          if (cleaned) return
          cleaned = true
          root.remove()
          var style = document.getElementById('splash-style')
          if (style) style.remove()
          html.removeAttribute('data-splash')
          window.dispatchEvent(new Event('musa:splash-done'))
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
